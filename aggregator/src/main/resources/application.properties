spring.application.name=newscheck-aggregator
server.port=8081

spring.datasource.url=jdbc:postgresql://postgres:5432/newscheck
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

newsapi.key=${NEWS_API_KEY:demo}
newsapi.base-url=https://newsapi.org/v2
guardian.key=${GUARDIAN_API_KEY:demo}
guardian.base-url=https://content.guardianapis.com

aggregator.fetch.cron=0 0/15 * * * *

# API key for /internal/** endpoints (set via AGGREGATOR_API_KEY env var)
aggregator.api-key=${AGGREGATOR_API_KEY:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when_authorized
