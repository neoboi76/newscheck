spring.application.name=newscheck-news-server
server.port=8080

spring.datasource.url=jdbc:postgresql://postgres:5432/newscheck
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool tuning
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.consumer.group-id=news-server-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.newscheck.*
spring.kafka.consumer.properties.spring.json.value.default.type=com.newscheck.newsserver.dto.ArticleEvent
# Enable manual offset acknowledgement so we don't lose messages on errors
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.consumer.enable-auto-commit=false

jwt.secret=${JWT_SECRET:changeme_use_a_long_random_secret_in_production_please}
jwt.expiration-ms=86400000

fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
fcm.project-id=${FCM_PROJECT_ID:}

news.default-page-size=20
news.max-page-size=100

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
